<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pocket War 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#07101a;color:#fff}
#app{position:fixed;inset:0;background:linear-gradient(#10243a,#07101a)}
canvas{display:block}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 50% 25%,rgba(37,104,163,.28),rgba(2,8,15,.88))}
.panel{width:min(720px,96vw);max-height:92vh;overflow:auto;padding:24px;border:1px solid #4c7190;border-radius:22px;background:linear-gradient(145deg,rgba(10,28,45,.94),rgba(4,12,21,.96));box-shadow:0 18px 60px #0009}
.logo{font-size:clamp(42px,10vw,86px);font-weight:1000;letter-spacing:-3px;text-align:center;color:#ffb52d;text-shadow:0 5px 0 #7b2c09,0 9px 20px #000}
.sub{text-align:center;color:#bcd5e8;margin:-3px 0 24px;font-weight:700;letter-spacing:2px}
.btn{width:100%;min-height:54px;margin:8px 0;border:1px solid #5e83a0;border-radius:13px;color:#fff;font-size:18px;font-weight:800;background:linear-gradient(#17486f,#0b2944);box-shadow:inset 0 1px #ffffff30;touch-action:manipulation}
.btn.primary{background:linear-gradient(#20a64d,#0a6d2e);border-color:#68ef8e}
.btn.blue{background:linear-gradient(#276be4,#123c91);border-color:#70a4ff}
.btn.danger{background:linear-gradient(#c83b3b,#771919)}
.btn:active{transform:scale(.98)}
.maps{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.map{padding:12px;border-radius:15px;border:1px solid #3f6078;background:#0a1b2a;cursor:pointer}.map b{display:block;margin-top:8px}.thumb{height:125px;border-radius:11px;position:relative;overflow:hidden;background:linear-gradient(145deg,#4f9d45,#193f2a)}.thumb.desert{background:linear-gradient(145deg,#d4a35b,#684827)}.thumb.island{background:linear-gradient(145deg,#24a8c0,#07506b)}.thumb.mountain{background:linear-gradient(145deg,#b8c5cf,#374c59)}
.thumb:after{content:"";position:absolute;inset:18% 12%;border-radius:20%;background:linear-gradient(135deg,#4f9b42 0 38%,#b9d07d 39% 45%,#497d39 46%);transform:rotate(-10deg);box-shadow:0 18px 0 #0002}
#hud{display:none;position:absolute;inset:0;pointer-events:none}.topbar{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:auto}.badge{background:#071727dd;border:1px solid #55758d;border-radius:12px;padding:10px 13px;font-weight:800}.blueText{color:#58a8ff}.redText{color:#ff6565}
#actions{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:8px;align-items:end;pointer-events:auto}.unitCard{flex:1;min-width:0;background:#071727eF;border:1px solid #55758d;border-radius:14px;padding:10px}.unitCard strong{font-size:18px}.bar{height:7px;background:#4a2020;border-radius:9px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:#42df68}.actionBtns{display:flex;gap:8px}.smallBtn{height:52px;padding:0 15px;border-radius:12px;border:1px solid #5d7d95;background:#123451;color:#fff;font-weight:900}.smallBtn.active{background:#e7a51b;color:#111}.smallBtn.end{background:#173d20;border-color:#70dc8a}.hint{position:absolute;top:64px;left:50%;transform:translateX(-50%);background:#061321dd;border:1px solid #55758d;border-radius:10px;padding:8px 13px;pointer-events:none}
@media(max-width:650px){.panel{padding:18px}.maps{gap:8px}.thumb{height:95px}.actionBtns{flex-wrap:wrap}.smallBtn{flex:1}.unitCard{font-size:12px}.unitCard strong{font-size:15px}.badge{font-size:12px;padding:8px}.logo{font-size:48px}}
.hidden{display:none!important}
input{width:100%;height:50px;border-radius:11px;border:1px solid #55758d;background:#061321;color:#fff;padding:0 14px;font-size:18px;margin:8px 0}
.row{display:flex;gap:10px}.row>*{flex:1}
</style>
</head>
<body>
<div id="app">
<div id="menu" class="screen"><div class="panel">
<div class="logo">POCKET WAR</div><div class="sub">TACTICS • BATTLE • VICTORY</div>
<button class="btn primary" id="vsai">⚔️ PLAY VS AI</button>
<button class="btn blue" id="online">🌐 ONLINE MULTIPLAYER</button>
<button class="btn" id="settings">⚙️ SETTINGS</button>
<p style="text-align:center;color:#8da7ba">3D toy-like battlefield • original assets • mobile ready</p>
</div></div>

<div id="maps" class="screen hidden"><div class="panel"><h1>SELECT MAP</h1>
<div class="maps">
<div class="map" data-map="green"><div class="thumb"></div><b>Green Fields</b></div>
<div class="map" data-map="desert"><div class="thumb desert"></div><b>Desert Base</b></div>
<div class="map" data-map="island"><div class="thumb island"></div><b>Island War</b></div>
<div class="map" data-map="mountain"><div class="thumb mountain"></div><b>Mountain Pass</b></div>
</div><button class="btn" id="backMenu">← Main Menu</button></div></div>

<div id="onlinePanel" class="screen hidden"><div class="panel"><h1>🌐 ONLINE MULTIPLAYER</h1>
<button class="btn primary" id="create">CREATE ROOM</button>
<div class="row"><input id="roomInput" placeholder="ROOM CODE"><button class="btn blue" id="join">JOIN</button></div>
<div id="roomStatus" style="padding:12px;color:#a9c5d9"></div>
<button class="btn" id="backOnline">← Main Menu</button></div></div>

<div id="settingsPanel" class="screen hidden"><div class="panel"><h1>⚙️ SETTINGS</h1>
<label>Graphics <select id="quality" style="width:100%;height:46px;background:#061321;color:#fff;border-radius:9px;margin:8px 0"><option>High</option><option>Medium</option><option>Low</option></select></label>
<button class="btn" id="backSettings">← Main Menu</button></div></div>

<div id="hud">
<div class="topbar"><div class="badge" id="turn">⭐ Turn 1 • BLUE</div><div class="badge">Objective: Destroy enemy HQ</div></div>
<div class="hint" id="hint">Tap a blue unit</div>
<div id="actions"><div class="unitCard"><strong id="unitName">Select a unit</strong><div id="unitStats">Tap a unit on the battlefield</div><div class="bar"><i id="hpBar" style="width:100%"></i></div></div><div class="actionBtns"><button class="smallBtn" id="moveBtn">➡ Move</button><button class="smallBtn" id="attackBtn">✦ Attack</button><button class="smallBtn" id="waitBtn">◷ Wait</button><button class="smallBtn end" id="endBtn">End Turn</button></div></div>
</div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/controls/OrbitControls.js';

const $=id=>document.getElementById(id);
const screens=['menu','maps','onlinePanel','settingsPanel'];
function show(id){screens.forEach(x=>$(x).classList.toggle('hidden',x!==id)); $('hud').style.display=id==='battle'?'block':'none'}
show('menu');

let scene,camera,renderer,controls,raycaster,mouse,units=[],selected=null,mode='select',turn=1,side='blue',mapName='green',anim=[];
const tileSize=2.35,W=9,H=7;
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.82});
const blue=0x2b78d4, red=0xd83c3c, grass=0x4d9343, darkGrass=0x326b37, water=0x167aa1, road=0x77715f;

function init3D(){
 scene=new THREE.Scene(); scene.background=new THREE.Color(0x86c9ed);
 camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,200);
 camera.position.set(12,17,18);
 renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,1.7)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 document.getElementById('app').appendChild(renderer.domElement);
 controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true; controls.maxPolarAngle=Math.PI/2.25; controls.minDistance=10; controls.maxDistance=34; controls.target.set(0,0,0);
 raycaster=new THREE.Raycaster(); mouse=new THREE.Vector2();
 scene.add(new THREE.HemisphereLight(0xd9f2ff,0x36542d,2.1));
 const sun=new THREE.DirectionalLight(0xffffff,3.2);sun.position.set(8,18,7);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
 renderer.domElement.addEventListener('pointerdown',pick);
 window.addEventListener('resize',resize);
 animate();
}
function resize(){if(!camera)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function clearScene(){while(scene.children.length>3)scene.remove(scene.children[3]);units=[];selected=null}
function makeTile(x,z,y,c){
 const g=new THREE.CylinderGeometry(1.28,1.42,.55,6);const m=new THREE.Mesh(g,mat(c));m.position.set(x*tileSize,y,z*tileSize);m.receiveShadow=true;m.userData={tile:true,x,z,walkable:true};scene.add(m);return m;
}
function tree(x,z){const g=new THREE.Group();const t=new THREE.Mesh(new THREE.CylinderGeometry(.16,.23,1.05,7),mat(0x754f2a));t.position.y=.7;const c=new THREE.Mesh(new THREE.ConeGeometry(.8,1.8,8),mat(0x28683b));c.position.y=1.75;g.add(t,c);g.position.set(x*tileSize,0,z*tileSize);g.traverse(o=>{if(o.isMesh)o.castShadow=true});scene.add(g)}
function rock(x,z){const r=new THREE.Mesh(new THREE.DodecahedronGeometry(.65,.1),mat(0x65727a));r.position.set(x*tileSize,.55,z*tileSize);r.scale.y=.75;r.castShadow=true;scene.add(r)}
function makeBase(x,z,color){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(1.8,.8,1.5),mat(color));b.position.y=.55;const roof=new THREE.Mesh(new THREE.ConeGeometry(1.25,.7,4),mat(0x303a43));roof.position.y=1.3;roof.rotation.y=Math.PI/4;g.add(b,roof);g.position.set(x*tileSize,0,z*tileSize);g.traverse(o=>{if(o.isMesh)o.castShadow=true});scene.add(g);return g}
function buildMap(){
 clearScene();
 const waterMap=mapName==='island';
 for(let z=-H/2;z<=H/2;z++)for(let x=-W/2;x<=W/2;x++){
   let y=.1, c=grass;
   if(waterMap && (Math.abs(x)>3.1||Math.abs(z)>2.1)){c=water;y=-.15}
   else if(mapName==='desert')c=0xb68a4f;
   else if(mapName==='mountain')y=Math.max(0,2.2-Math.abs(x)-Math.abs(z)*.45),c=0x65796b;
   else if((x+z)%5===0)c=darkGrass;
   const tile=makeTile(x,z,y,c);
   if(c!==water && Math.random()<.13)tree(x,z);
   if(c!==water && Math.random()<.07)rock(x,z);
 }
 // roads
 for(let x=-4;x<=4;x++){const p=new THREE.Mesh(new THREE.BoxGeometry(1.0,.08,2.0),mat(road));p.position.set(x*tileSize,.4,0);scene.add(p)}
 // river and bridges
 if(!waterMap){
   const river=new THREE.Mesh(new THREE.BoxGeometry(3.0,.08,20),mat(water));river.position.y=.3;river.rotation.y=.12;scene.add(river);
   for(let z=-2;z<=2;z+=4){const br=new THREE.Mesh(new THREE.BoxGeometry(3.4,.35,2.1),mat(0x8a5c32));br.position.set(0,.55,z*tileSize);br.castShadow=true;scene.add(br)}
 }
 makeBase(-3,-2,blue);makeBase(3,2,red);
 spawnUnits();
}
function unitMesh(u){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(1.05,.55,.9),mat(u.side==='blue'?blue:red));body.position.y=.7;
 body.castShadow=true;g.add(body);
 if(u.type==='infantry'){
   const head=new THREE.Mesh(new THREE.SphereGeometry(.3,10,8),mat(0xffc49b));head.position.set(0,1.35,0);g.add(head);
   const helmet=new THREE.Mesh(new THREE.SphereGeometry(.34,10,6),mat(u.side==='blue'?0x173b78:0x751f25));helmet.position.set(0,1.5,0);g.add(helmet);
 }else{
   const turret=new THREE.Mesh(new THREE.CylinderGeometry(.38,.48,.25,10),mat(u.side==='blue'?0x194f91:0x942828));turret.position.y=1.05;turret.rotation.x=Math.PI/2;g.add(turret);
   const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,1.2,8),mat(0x22272b));barrel.rotation.z=Math.PI/2;barrel.position.set(.55,1.08,0);g.add(barrel);
 }
 g.position.set(u.x*tileSize,.05,u.z*tileSize);g.userData.unit=u;scene.add(g);u.obj=g;
}
function spawnUnits(){
 const data=[
 {id:'b1',side:'blue',type:'infantry',x:-3,z:-1,hp:100,max:100,move:3,range:2,damage:25},
 {id:'b2',side:'blue',type:'tank',x:-2,z:-2,hp:180,max:180,move:3,range:2,damage:45},
 {id:'b3',side:'blue',type:'artillery',x:-3,z:1,hp:100,max:100,move:2,range:5,damage:50},
 {id:'r1',side:'red',type:'infantry',x:3,z:1,hp:100,max:100,move:3,range:2,damage:25},
 {id:'r2',side:'red',type:'tank',x:2,z:2,hp:180,max:180,move:3,range:2,damage:45},
 {id:'r3',side:'red',type:'artillery',x:3,z:-1,hp:100,max:100,move:2,range:5,damage:50}
 ];
 units=data;units.forEach(unitMesh);
}
function pick(e){
 if($('hud').style.display!=='block')return;
 const r=renderer.domElement.getBoundingClientRect();mouse.x=((e.clientX-r.left)/r.width)*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;
 raycaster.setFromCamera(mouse,camera);const hits=raycaster.intersectObjects(scene.children,true);
 for(const h of hits){let o=h.object;while(o.parent&&!o.userData.unit)o=o.parent;if(o.userData.unit){handleUnit(o.userData.unit);return}}
 // select terrain by nearest tile intersection
 if(selected && mode==='move'){
   const p=new THREE.Vector3();raycaster.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0),p);
   const x=Math.round(p.x/tileSize),z=Math.round(p.z/tileSize);tryMove(x,z);
 }
}
function handleUnit(u){
 if(mode==='attack'&&selected&&u.side!==side){attack(u);return}
 if(u.side===side){selected=u;mode='select';highlight();updateCard()}
}
function highlight(){
 document.querySelectorAll('.rangeMarker').forEach(x=>scene.remove(x));
 if(!selected)return;
 const radius=selected.move;
 for(let z=-H/2;z<=H/2;z++)for(let x=-W/2;x<=W/2;x++){
   if(Math.abs(x-selected.x)+Math.abs(z-selected.z)<=radius){
     const m=new THREE.Mesh(new THREE.CylinderGeometry(1.02,1.02,.03,6),mat(0x67b9ff));m.material.transparent=true;m.material.opacity=.28;m.position.set(x*tileSize,.45,z*tileSize);m.userData.rangeMarker=true;m.name='rangeMarker';m.userData.tile=true;scene.add(m);
   }
 }
}
function tryMove(x,z){
 if(!selected||mode!=='move')return;
 const dist=Math.abs(x-selected.x)+Math.abs(z-selected.z);
 if(dist>selected.move||x<-4||x>4||z<-3||z>3)return;
 if(units.some(u=>u.hp>0&&u!==selected&&u.x===x&&u.z===z)){return}
 selected.x=x;selected.z=z;selected.obj.position.set(x*tileSize,.05,z*tileSize);mode='select';highlight();$('hint').textContent='Unit moved. Attack or end turn.';broadcast(); 
}
function attack(target){
 if(!selected)return;const d=Math.abs(target.x-selected.x)+Math.abs(target.z-selected.z);
 if(d>selected.range){$('hint').textContent='Target out of range';return}
 target.hp=Math.max(0,target.hp-selected.damage);mode='select';$('hint').textContent=`${selected.type} attacks ${target.type} for ${selected.damage}`;
 flash(target); if(target.hp<=0){scene.remove(target.obj);units=units.filter(x=>x!==target);if(target.type==='hq')win();}
 updateCard();broadcast();
}
function flash(u){const e=new THREE.PointLight(0xffb43b,8,5);e.position.copy(u.obj.position);scene.add(e);setTimeout(()=>scene.remove(e),180)}
function updateCard(){
 if(!selected){$('unitName').textContent='Select a unit';$('unitStats').textContent='Tap a blue unit';return}
 $('unitName').textContent=selected.type.toUpperCase();$('unitStats').textContent=`HP ${selected.hp}/${selected.max} • Move ${selected.move} • Range ${selected.range} • Damage ${selected.damage}`;$('hpBar').style.width=(selected.hp/selected.max*100)+'%';
}
function startBattle(m){mapName=m;showBattle();buildMap()}
function showBattle(){screens.forEach(x=>$(x).classList.add('hidden'));$('hud').style.display='block';if(!renderer)init3D()}
function endTurn(){if(side!=='blue')return;mode='select';selected=null;highlight();side='red';turn++;$('turn').textContent=`⭐ Turn ${turn} • RED`;aiTurn()}
function aiTurn(){
 setTimeout(()=>{
  const reds=units.filter(u=>u.side==='red'&&u.hp>0);const blues=units.filter(u=>u.side==='blue'&&u.hp>0);
  reds.forEach(r=>{
   let target=blues.slice().sort((a,b)=>Math.abs(a.x-r.x)+Math.abs(a.z-r.z)- (Math.abs(b.x-r.x)+Math.abs(b.z-r.z)))[0];
   if(!target)return;
   const d=Math.abs(target.x-r.x)+Math.abs(target.z-r.z);
   if(d<=r.range){target.hp=Math.max(0,target.hp-r.damage);flash(target);if(target.hp<=0){scene.remove(target.obj);units=units.filter(x=>x!==target)}}
   else{const sx=Math.sign(target.x-r.x),sz=Math.sign(target.z-r.z);const nx=r.x+sx,nz=r.z+sz;if(!units.some(u=>u.hp>0&&u!==r&&u.x===nx&&u.z===nz)){r.x=nx;r.z=nz;r.obj.position.set(nx*tileSize,.05,nz*tileSize)}}
  });
  side='blue';$('turn').textContent=`⭐ Turn ${turn} • BLUE`;$('hint').textContent='Your move — tap a blue unit';broadcast();
 },700);
}
function win(){setTimeout(()=>{const p=document.createElement('div');p.className='screen';p.innerHTML='<div class="panel" style="text-align:center"><div class="logo" style="font-size:56px">VICTORY!</div><p>Enemy forces defeated.</p><button class="btn primary" id="again">PLAY AGAIN</button><button class="btn" id="home">MAIN MENU</button></div>';$('app').appendChild(p);$('again').onclick=()=>{p.remove();startBattle(mapName)};$('home').onclick=()=>{p.remove();location.reload()};},300)}
function broadcast(){if(window.sock&&window.room)window.sock.emit('state',{room:window.room,state:{units:units.map(u=>({id:u.id,side:u.side,type:u.type,x:u.x,z:u.z,hp:u.hp)),turn,side}})}
function online(){if(window.io){window.sock=io();sock.on('roomJoined',d=>{$('roomStatus').textContent='Room '+d.room+' • Waiting/connected players: '+d.count;window.room=d.room});sock.on('remoteState',s=>{if(!s)return;turn=s.turn;side=s.side;s.units.forEach(r=>{const u=units.find(x=>x.id===r.id);if(u){u.x=r.x;u.z=r.z;u.hp=r.hp;if(u.obj)u.obj.position.set(u.x*tileSize,.05,u.z*tileSize)}})})}}
$('vsai').onclick=()=>show('maps');$('online').onclick=()=>{show('onlinePanel');online()};$('settings').onclick=()=>show('settingsPanel');
$('backMenu').onclick=()=>show('menu');$('backOnline').onclick=()=>show('menu');$('backSettings').onclick=()=>show('menu');
document.querySelectorAll('.map').forEach(m=>m.onclick=()=>startBattle(m.dataset.map));
$('moveBtn').onclick=()=>{if(selected){mode='move';$('hint').textContent='Tap a reachable tile';highlight()}};
$('attackBtn').onclick=()=>{if(selected){mode='attack';$('hint').textContent='Tap an enemy in range'}};
$('waitBtn').onclick=()=>{mode='select';selected=null;highlight();updateCard()};
$('endBtn').onclick=endTurn;
$('create').onclick=()=>{if(!window.sock)online();setTimeout(()=>sock.emit('createRoom'),150)};
$('join').onclick=()=>{if(!window.sock)online();setTimeout(()=>sock.emit('joinRoom',$('roomInput').value.trim().toUpperCase()),150)};
if(window.io)online();
</script>
</body>
</html>
