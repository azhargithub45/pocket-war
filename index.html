<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Epic Little War - Step 1</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
body{
  background:
    radial-gradient(circle at 20% 15%,rgba(255,255,255,.16),transparent 25%),
    radial-gradient(circle at 80% 70%,rgba(0,0,0,.15),transparent 35%),
    linear-gradient(145deg,#65b6a8,#319080 48%,#236c66);
  color:#fff;position:relative;
}
body:before{
  content:"";position:absolute;inset:0;opacity:.16;
  background:
    linear-gradient(30deg,#fff 12%,transparent 12.5%,transparent 87%,#fff 87.5%,#fff),
    linear-gradient(150deg,#fff 12%,transparent 12.5%,transparent 87%,#fff 87.5%,#fff);
  background-size:48px 28px,48px 28px;background-position:0 0,24px 14px;
}

/* decorative battlefield background */
.island{
  position:absolute;width:210px;height:110px;border-radius:48% 52% 45% 55%;
  background:linear-gradient(#77b85d,#3c713d);
  box-shadow:0 18px 0 #214d43,0 25px 30px #073d3980;
  transform:rotate(-8deg);
}
.island:before,.island:after{
  content:"";position:absolute;border-radius:50%;background:#2f6639;
}
.island:before{width:28px;height:42px;left:35px;top:18px;box-shadow:70px 15px 0 #397443,120px -4px 0 #285d34}
.island:after{width:16px;height:16px;right:35px;bottom:22px;background:#8d8a62}
.i1{right:-55px;top:160px}.i2{left:-95px;bottom:110px;transform:rotate(13deg) scale(.8)}
.i3{right:-90px;bottom:-10px;transform:rotate(-18deg) scale(.65)}

.plane{
  position:absolute;right:10px;top:145px;width:85px;height:24px;
  background:#416ca0;border-radius:50% 45% 40% 35%;transform:rotate(-28deg);
  box-shadow:0 5px 0 #23456e;
}
.plane:before{content:"";position:absolute;width:55px;height:10px;left:12px;top:-7px;background:#294d77;transform:rotate(8deg);border-radius:50%}
.plane:after{content:"";position:absolute;width:20px;height:6px;right:-12px;top:5px;background:#d9e5e9;border-radius:5px;box-shadow:10px 0 0 #d9e5e9}

.menu{
  position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
  width:min(900px,92vw);height:min(520px,70vh);min-height:360px;
  background:linear-gradient(180deg,#182b28ee,#091613f5);
  border:4px solid #d62932;border-radius:14px;
  box-shadow:0 0 0 2px #5c1015,inset 0 0 0 2px #07100f,0 18px 50px #0009;
  padding:42px 18px 18px;
}
.heading{
  position:absolute;left:50%;top:-38px;transform:translateX(-50%);
  width:440px;max-width:72%;padding:14px 20px;text-align:center;
  color:#fff;font-size:28px;font-weight:900;letter-spacing:.5px;
  text-shadow:0 3px 2px #000;
  background:linear-gradient(#171313,#050505);
  border:3px solid #f0a72d;border-radius:20px;
  box-shadow:0 0 0 2px #65130f,0 6px 15px #0009;
}
.version{position:absolute;left:2px;top:-28px;color:#fff;font-size:13px;font-weight:900}

.content{width:100%;height:100%;display:grid;grid-template-columns:1.08fr 1fr;gap:14px}
.preview{
  border:3px solid #091311;border-radius:12px;position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 50% 38%,#243a36,#07100e 72%);
  box-shadow:inset 0 0 25px #000;
}
.preview:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 35px #000;pointer-events:none}
.game-title{
  position:absolute;left:50%;top:20px;transform:translateX(-50%);
  font-size:30px;font-weight:900;white-space:nowrap;text-shadow:0 4px 2px #000;z-index:3;
}

/* CSS cartoon commander */
.commander{
  position:absolute;left:50%;top:55%;width:185px;height:285px;
  transform:translate(-50%,-50%);z-index:2;
}
.head{
  position:absolute;left:48px;top:30px;width:88px;height:80px;
  border-radius:48% 48% 44% 44%;background:#e7c39f;border:3px solid #8e684e;
}
.face-shadow{position:absolute;left:67px;top:72px;width:48px;height:20px;border-radius:50%;background:#c99d7b55}
.hair{
  position:absolute;left:36px;top:8px;width:112px;height:37px;
  border-radius:60px 60px 10px 10px;background:#d8d9d5;border:3px solid #5c5d5c;z-index:2;
}
.cap{
  position:absolute;left:34px;top:-6px;width:118px;height:43px;
  border-radius:55% 55% 20% 20%;background:linear-gradient(#2345c6,#12257e);
  border:4px solid #e8c52d;z-index:3;
}
.cap:after{content:"";position:absolute;left:-12px;right:-12px;bottom:-8px;height:11px;background:#e2bd26;border-radius:50%}
.eye{position:absolute;top:64px;width:9px;height:6px;background:#222;border-radius:50%;z-index:4}
.eye.l{left:67px}.eye.r{left:103px}
.mouth{position:absolute;left:76px;top:84px;width:34px;height:8px;border-bottom:4px solid #6e4635;border-radius:50%;z-index:4}
.body{
  position:absolute;left:35px;top:112px;width:118px;height:125px;
  background:linear-gradient(90deg,#152d9d,#2d55df,#152b9b);
  border-radius:22px 22px 16px 16px;border:4px solid #0b1b6e;
  box-shadow:inset 10px 0 15px #ffffff18,inset -10px 0 15px #0004;
}
.collar{position:absolute;left:39px;top:5px;width:39px;height:25px;background:#edc53b;clip-path:polygon(0 0,100% 0,68% 100%,32% 100%)}
.button{position:absolute;left:54px;top:39px;width:10px;height:10px;border-radius:50%;background:#edc53b;box-shadow:0 26px #edc53b,0 52px #edc53b}
.arm{position:absolute;top:124px;width:42px;height:91px;background:linear-gradient(90deg,#142c9e,#3154db);border:4px solid #0b1b6e;border-radius:24px}
.arm.l{left:12px;transform:rotate(8deg)}.arm.r{right:12px;transform:rotate(-8deg)}
.hand{position:absolute;bottom:-13px;left:6px;width:32px;height:32px;border-radius:50%;background:#e7c39f;border:3px solid #8e684e}
.arm.r .hand{left:auto;right:6px}
.boot{position:absolute;top:226px;width:55px;height:45px;background:#17191d;border-radius:12px 12px 20px 20px;border:4px solid #08090a}
.boot.l{left:42px}.boot.r{right:42px}

.controls{display:flex;flex-direction:column;gap:13px}
.spacer{flex:1}
.bigbtn{
  height:72px;border-radius:15px;border:3px solid #dfb82b;
  background:linear-gradient(#172724,#07110f);color:#f7f7f7;
  font-size:22px;font-weight:900;text-shadow:0 3px 2px #000;
  box-shadow:inset 0 0 0 2px #29453e,0 4px 7px #0009;cursor:pointer;
}
.bigbtn:hover{filter:brightness(1.15)}
.bigbtn:active{transform:translateY(2px)}
.play{border-color:#d8b329;background:linear-gradient(#17351e,#0a1710)}
.icon{display:inline-flex;width:42px;height:42px;margin-right:13px;vertical-align:middle;align-items:center;justify-content:center;font-size:27px}
.version2{position:absolute;right:10px;bottom:8px;color:#aaa;font-size:11px}

@media(max-width:650px){
  .menu{width:92vw;height:68vh;min-height:390px;padding:34px 9px 9px}
  .heading{font-size:20px;top:-30px;padding:10px 14px}
  .content{gap:7px}
  .game-title{font-size:20px;top:18px}
  .bigbtn{height:58px;font-size:15px;border-radius:11px}
  .icon{font-size:21px;width:30px;margin-right:5px}
  .commander{transform:translate(-50%,-50%) scale(.70)}
  .island{opacity:.7}
}
</style>
</head>
<body>
<div class="island i1"></div><div class="island i2"></div><div class="island i3"></div><div class="plane"></div>

<div class="menu">
  <div class="version">(v1.0)</div>
  <div class="heading">MAIN MENU</div>

  <div class="content">
    <div class="preview">
      <div class="game-title">WAR GAME</div>

      <div class="commander">
        <div class="cap"></div><div class="hair"></div><div class="head"></div>
        <div class="eye l"></div><div class="eye r"></div><div class="mouth"></div>
        <div class="body"><div class="collar"></div><div class="button"></div></div>
        <div class="arm l"><div class="hand"></div></div>
        <div class="arm r"><div class="hand"></div></div>
        <div class="boot l"></div><div class="boot r"></div>
      </div>
    </div>

    <div class="controls">
      <button class="bigbtn"><span class="icon">⚙️</span>HELP &amp; OPTIONS</button>
      <div class="spacer"></div>
      <button class="bigbtn"><span class="icon">📂</span>LOAD BATTLE</button>
      <button class="bigbtn play" id="play"><span class="icon">▶</span>PLAY GAME</button>
    </div>
  </div>
  <div class="version2">STEP 1 • MAIN MENU</div>
</div>

<script>
document.getElementById("play").onclick=()=>{
  alert("STEP 1 COMPLETE ✅\n\nNext: Battle Screen");
};
</script>
</body>
</html>
