<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pocket War 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061016;font-family:Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.ui{position:fixed;z-index:5;color:#eaf5f7;background:#07151cdd;border:1px solid #49636c;border-radius:10px;box-shadow:0 5px 20px #0008}
#top{top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:stretch}
.box{padding:10px 12px;font-weight:700}
#title{font-size:16px;letter-spacing:.5px}#turn{min-width:150px}#status{margin-left:auto;font-size:13px}
#help{left:10px;bottom:10px;padding:9px 11px;font-size:11px;line-height:1.4;max-width:370px}
#buttons{right:10px;bottom:10px;display:flex;gap:7px;background:transparent;border:0;box-shadow:none}
button{padding:10px 13px;border-radius:9px;border:1px solid #57717a;background:#10232b;color:white;font-weight:700}
button.primary{background:#07608b}
#toast{left:50%;top:105px;transform:translateX(-50%);padding:9px 13px;opacity:0;transition:.2s}
#toast.show{opacity:1}
@media(max-width:600px){#top{gap:5px}.box{padding:8px;font-size:12px}#title{max-width:130px}#turn{min-width:110px}#status{max-width:90px;overflow:hidden}#help{bottom:65px;font-size:10px;max-width:330px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top" class="ui">
 <div id="title" class="box">⚔ POCKET WAR 3D</div>
 <div id="turn" class="box">🔵 BLUE • YOUR TURN</div>
 <div id="status" class="box">Select a unit</div>
</div>
<div id="help" class="ui"><b>3D BATTLEFIELD</b><br>Drag to rotate • Pinch / wheel to zoom<br>Select a unit → tap a highlighted position to move • tap enemy to attack</div>
<div id="buttons">
 <button id="center">Center</button><button id="end" class="primary">End Turn</button><button id="reset">Reset</button>
</div>
<div id="toast" class="ui"></div>

<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight,D=devicePixelRatio||1;
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0)}resize();addEventListener('resize',resize);

const N=12, tile=2;
let yaw=-.62, pitch=.92, zoom=1, panX=0,panY=30;
let selected=null,turn='blue',gameOver=false,drag=false,lastX=0,lastY=0,moved=false;

const units=[
 {team:'blue',type:'infantry',x:1,z:10,hp:100},
 {team:'blue',type:'tank',x:2,z:10,hp:100},
 {team:'blue',type:'infantry',x:1,z:9,hp:100},
 {team:'red',type:'infantry',x:10,z:1,hp:100},
 {team:'red',type:'tank',x:9,z:1,hp:100},
 {team:'red',type:'infantry',x:10,z:2,hp:100}
];
const blocked=new Set(['3,3','8,7','5,5','2,4','9,3','9,8','3,8']);
const trees=new Set(['1,1','2,2','10,2','9,9','2,9','10,10','4,2','8,9']);
const water=new Set(); for(let z=5;z<=6;z++)for(let x=0;x<N;x++)water.add(x+','+z);
for(let x=4;x<8;x++){water.delete(x+',5');water.delete(x+',6')}

function iso(x,y,z){
 const X=(x-(N-1)/2)*tile, Z=(z-(N-1)/2)*tile;
 const cy=Math.cos(yaw),sy=Math.sin(yaw);
 const rx=X*cy-Z*sy, rz=X*sy+Z*cy;
 const cp=Math.cos(pitch),sp=Math.sin(pitch);
 const sx=rx, sy2=rz*cp-y*sp, depth=rz*sp+y*cp;
 const scale=52*zoom;
 return {x:W/2+sx*scale+panX,y:H*.52-sy2*scale+panY,depth};
}
function poly(points,fill,stroke){
 ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();
 ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}
}
function tileTop(x,z,y=0){
 const a=iso(x-.98,y,z-.98),b=iso(x+.98,y,z-.98),c=iso(x+.98,y,z+.98),d=iso(x-.98,y,z+.98);
 poly([a,b,c,d], water.has(x+','+z)?'#16566b':((x+z)%3?'#3d7040':'#345f38'),'#203e32');
}
function box(x,z,w,d,h,color){
 const p=iso(x,0,z),a=iso(x-w/2,0,z-d/2),b=iso(x+w/2,0,z-d/2),c=iso(x+w/2,0,z+d/2),q=iso(x-w/2,0,z+d/2);
 const ah=iso(x-w/2,h,z-d/2),bh=iso(x+w/2,h,z-d/2),ch=iso(x+w/2,h,z+d/2),qh=iso(x-w/2,h,z+d/2);
 poly([ah,bh,ch,qh],color);
 poly([qh,ch,c,q],'#263e29');poly([bh,ch,c,b],'#315b37');
}
function tree(x,z){
 const p=iso(x,0,z),t=iso(x,.9,z),c=iso(x,2.3,z);
 ctx.strokeStyle='#5b3b25';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(t.x,t.y);ctx.stroke();
 ctx.fillStyle='#173d26';ctx.beginPath();ctx.arc(c.x,c.y,24,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#255a31';ctx.beginPath();ctx.arc(c.x-8,c.y-7,17,0,Math.PI*2);ctx.fill();
}
function building(x,z){
 box(x,z,1.35,1.35,1.1,'#77705f');
 const p=iso(x,1.1,z);ctx.fillStyle='#383a37';ctx.beginPath();
 ctx.moveTo(p.x,p.y-24);ctx.lineTo(p.x+30,p.y-8);ctx.lineTo(p.x,p.y+9);ctx.lineTo(p.x-30,p.y-8);ctx.closePath();ctx.fill();
}
function unitDraw(u){
 const p=iso(u.x,0,u.z);
 const blue=u.team==='blue', main=blue?'#169bea':'#df3941', dark=blue?'#063c62':'#64151b';
 if(u.type==='tank'){
   box(u.x,u.z,.95,.75,.42,main);
   const q=iso(u.x,.55,u.z);ctx.fillStyle=main;ctx.beginPath();ctx.ellipse(q.x,q.y,19,11,0,0,Math.PI*2);ctx.fill();
   const r=iso(u.x+.48,.6,u.z);ctx.strokeStyle=dark;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(r.x,r.y);ctx.stroke();
 }else{
   const q=iso(u.x,.55,u.z);ctx.fillStyle=main;ctx.beginPath();ctx.ellipse(q.x,q.y,12,18,0,0,Math.PI*2);ctx.fill();
   const h=iso(u.x,1.25,u.z);ctx.fillStyle=dark;ctx.beginPath();ctx.arc(h.x,h.y,8,0,Math.PI*2);ctx.fill();
 }
 const hb=iso(u.x,1.65,u.z), ww=36;ctx.fillStyle='#111';ctx.fillRect(hb.x-ww/2,hb.y,ww,5);
 ctx.fillStyle=u.hp>40?'#25d66d':'#ffb52e';ctx.fillRect(hb.x-ww/2,hb.y,ww*u.hp/100,5);
 if(selected===u){ctx.strokeStyle='#ffe45b';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y+2,24,0,Math.PI*2);ctx.stroke()}
}
function render(){
 ctx.clearRect(0,0,W,H);
 const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#0a1a21');grad.addColorStop(1,'#071016');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
 let items=[];
 for(let z=0;z<N;z++)for(let x=0;x<N;x++){const p=iso(x,0,z);items.push({d:p.depth,f:()=>tileTop(x,z)});}
 trees.forEach(s=>{let [x,z]=s.split(',').map(Number),p=iso(x,0,z);items.push({d:p.depth+1,f:()=>tree(x,z)})});
 blocked.forEach(s=>{let [x,z]=s.split(',').map(Number),p=iso(x,0,z);items.push({d:p.depth+1,f:()=>building(x,z)})});
 units.forEach(u=>{let p=iso(u.x,0,u.z);items.push({d:p.depth+2,f:()=>unitDraw(u)})});
 items.sort((a,b)=>a.d-b.d).forEach(i=>i.f());
 if(selected&&!gameOver){
  for(let z=0;z<N;z++)for(let x=0;x<N;x++){
   const c=units.find(u=>u.x===x&&u.z===z);const d=Math.abs(x-selected.x)+Math.abs(z-selected.z);
   if(d>0&&d<=2&&!blocked.has(x+','+z)&&!water.has(x+','+z)&&!c){
    const a=iso(x-.8,.04,z-.8),b=iso(x+.8,.04,z-.8),cc=iso(x+.8,.04,z+.8),q=iso(x-.8,.04,z+.8);poly([a,b,cc,q],'#4caf5033','#9cff65');
   }
  }
 }
 requestAnimationFrame(render);
}
render();

function toast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>e.classList.remove('show'),1300)}
function update(){document.getElementById('turn').textContent=(turn==='blue'?'🔵 BLUE':'🔴 RED')+' • '+(turn==='blue'?'YOUR TURN':'ENEMY TURN');document.getElementById('status').textContent=selected?selected.type.toUpperCase()+' • HP '+selected.hp+'/100':'Select a unit'}
function pick(mx,my){
 let best=null,bd=999;
 units.forEach(u=>{let p=iso(u.x,1,u.z),d=Math.hypot(mx-p.x,my-p.y);if(d<30&&d<bd){best=u;bd=d}});
 return best;
}
canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;moved=false});
canvas.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-lastX,dy=e.clientY-lastY;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;yaw+=dx*.008;pitch=Math.max(.55,Math.min(1.25,pitch+dy*.006));lastX=e.clientX;lastY=e.clientY});
canvas.addEventListener('pointerup',e=>{
 if(!moved){const u=pick(e.clientX,e.clientY);if(u){if(u.team===turn){selected=u;update()}else if(selected){attack(selected,u)}}else if(selected){moveTo(e.clientX,e.clientY)}}
 drag=false;
});
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom*=e.deltaY>0?.9:1.1;zoom=Math.max(.55,Math.min(1.8,zoom))},{passive:false});

function nearestCell(mx,my){
 let best=null,bd=1e9;
 for(let z=0;z<N;z++)for(let x=0;x<N;x++){let p=iso(x,0,z),d=Math.hypot(mx-p.x,my-p.y);if(d<bd){bd=d;best={x,z}}}
 return bd<70?best:null;
}
function moveTo(mx,my){
 const c=nearestCell(mx,my);if(!c)return;
 const d=Math.abs(c.x-selected.x)+Math.abs(c.z-selected.z);
 if(d>2||blocked.has(c.x+','+c.z)||water.has(c.x+','+c.z)||units.some(u=>u.x===c.x&&u.z===c.z)){toast('Invalid move');return}
 selected.x=c.x;selected.z=c.z;selected=null;update();
}
function attack(a,b){
 const d=Math.abs(a.x-b.x)+Math.abs(a.z-b.z);if(d>2){toast('Out of range');return}
 b.hp-=a.type==='tank'?45:30;toast('💥 Hit! Enemy HP '+Math.max(0,b.hp));
 if(b.hp<=0){units.splice(units.indexOf(b),1);toast('💥 Enemy unit destroyed!')}
 selected=null;update();if(!units.some(u=>u.team==='red')){gameOver=true;toast('🏆 BLUE WINS!')}
}
function ai(){
 const reds=units.filter(u=>u.team==='red');const blues=units.filter(u=>u.team==='blue');
 reds.forEach(r=>{let t=blues.find(b=>Math.abs(b.x-r.x)+Math.abs(b.z-r.z)<=2);if(t){t.hp-=r.type==='tank'?35:20;if(t.hp<=0)units.splice(units.indexOf(t),1)}});
 turn='blue';update();if(!units.some(u=>u.team==='red')){gameOver=true;toast('🏆 BLUE WINS!')}
}
document.getElementById('end').onclick=()=>{if(gameOver)return;selected=null;turn='red';update();setTimeout(ai,500)};
document.getElementById('center').onclick=()=>{yaw=-.62;pitch=.92;zoom=1;panX=0;panY=30};
document.getElementById('reset').onclick=()=>location.reload();
update();
</script>
</body>
</html>
