<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>War Game - Step 1</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
}
body{
  background:
    radial-gradient(circle at 50% 20%,#78b9a8 0,#5ca696 35%,#3e8175 100%);
  position:relative;
}
body:before{
  content:"";position:absolute;inset:0;opacity:.20;
  background-image:
    linear-gradient(30deg,#fff 12%,transparent 12.5%,transparent 87%,#fff 87.5%,#fff),
    linear-gradient(150deg,#fff 12%,transparent 12.5%,transparent 87%,#fff 87.5%,#fff);
  background-size:48px 28px;
  background-position:0 0,24px 14px;
}

/* Main game panel */
.menu{
  position:absolute;
  left:50%;top:51%;
  transform:translate(-50%,-50%);
  width:min(870px,86vw);
  height:min(500px,68vh);
  min-height:360px;
  background:linear-gradient(180deg,#182b28,#0d1917);
  border:4px solid #c9252d;
  border-radius:12px;
  box-shadow:
    0 0 0 2px #5c1015,
    inset 0 0 0 2px #07100f,
    0 15px 45px #0008;
  padding:38px 16px 16px;
}

/* Title plaque */
.heading{
  position:absolute;
  left:50%;top:-39px;
  transform:translateX(-50%);
  width:440px;max-width:65%;
  padding:15px 20px;
  text-align:center;
  color:#fff;
  font-size:27px;font-weight:900;
  text-shadow:0 3px 2px #000;
  background:linear-gradient(#130e0e,#050505);
  border:3px solid #f0a72d;
  border-radius:19px;
  box-shadow:0 0 0 2px #65130f,0 5px 15px #0008;
}

/* Two-column menu */
.content{
  width:100%;height:100%;
  display:grid;
  grid-template-columns:1.05fr 1fr;
  gap:12px;
}
.preview{
  border:3px solid #0c1514;
  border-radius:10px;
  background:
    radial-gradient(circle at 50% 35%,#1d2928,#050908 68%);
  box-shadow:inset 0 0 15px #000;
  position:relative;overflow:hidden;
}
.preview:after{
  content:"";
  position:absolute;inset:0;
  box-shadow:inset 0 0 30px #000;
}

/* Simple free CSS commander placeholder */
.commander{
  position:absolute;left:50%;top:56%;
  transform:translate(-50%,-50%);
  width:150px;height:245px;
  z-index:2;
}
.head{
  position:absolute;left:38px;top:20px;width:75px;height:72px;
  border-radius:45% 45% 42% 42%;
  background:#e6c2a0;
  border:2px solid #9a7357;
}
.hair{
  position:absolute;left:27px;top:3px;width:98px;height:34px;
  border-radius:55px 55px 10px 10px;
  background:#d5d8d5;border:2px solid #666;
}
.cap{
  position:absolute;left:25px;top:-8px;width:105px;height:38px;
  border-radius:50% 50% 18% 18%;
  background:#142d9b;border:4px solid #e7c22e;
}
.cap:after{
  content:"";position:absolute;left:-10px;right:-10px;bottom:-7px;height:9px;
  background:#e4bf28;border-radius:50%;
}
.cigar{
  position:absolute;right:-18px;top:57px;width:27px;height:8px;
  background:#b8732c;border-radius:5px;transform:rotate(-5deg);
}
.body{
  position:absolute;left:24px;top:84px;width:105px;height:118px;
  background:linear-gradient(90deg,#182fb0,#284de0,#152b9d);
  border-radius:20px 20px 13px 13px;
  border:3px solid #0d1d76;
}
.collar{
  position:absolute;left:34px;top:5px;width:36px;height:22px;
  background:#e8c33a;clip-path:polygon(0 0,100% 0,70% 100%,30% 100%);
}
.button{
  position:absolute;left:48px;top:35px;width:9px;height:9px;border-radius:50%;background:#e9c53a;
  box-shadow:0 25px #e9c53a,0 50px #e9c53a;
}
.arm{
  position:absolute;top:96px;width:36px;height:80px;background:#2344ca;border:3px solid #0d1d76;border-radius:20px;
}
.arm.l{left:5px;transform:rotate(8deg)} .arm.r{right:5px;transform:rotate(-8deg)}
.hand{
  position:absolute;bottom:-12px;left:5px;width:28px;height:28px;border-radius:50%;background:#e6c2a0;border:2px solid #9a7357;
}
.arm.r .hand{left:auto;right:5px}

/* Right side */
.controls{display:flex;flex-direction:column;gap:12px}
.spacer{flex:1}
.bigbtn{
  height:72px;border-radius:15px;
  border:3px solid #e0b62d;
  background:linear-gradient(#172321,#07100f);
  color:#f5f5f5;
  font-size:23px;font-weight:900;
  text-shadow:0 3px 2px #000;
  box-shadow:inset 0 0 0 2px #243e37,0 3px 5px #0008;
  cursor:pointer;
}
.bigbtn:active{transform:translateY(2px)}
.icon{
  display:inline-flex;width:42px;height:42px;margin-right:15px;
  vertical-align:middle;align-items:center;justify-content:center;
  font-size:28px;
}
.help{color:#ddd}
.play .icon{color:#e91e27}
.version{
  position:absolute;left:0;top:-28px;color:#fff;font-size:12px;font-weight:700;
}

/* responsive */
@media(max-width:650px){
 .menu{width:92vw;height:68vh;min-height:330px;padding:28px 9px 9px}
 .heading{font-size:20px;top:-30px;padding:10px 14px}
 .content{gap:7px}
 .bigbtn{height:58px;font-size:15px;border-radius:11px}
 .icon{font-size:21px;width:30px;margin-right:5px}
 .commander{transform:translate(-50%,-50%) scale(.72)}
}
</style>
</head>
<body>

<div class="menu">
  <div class="version">(v1.0)</div>
  <div class="heading">MAIN MENU</div>

  <div class="content">
    <div class="preview">
      <div style="position:absolute;left:50%;top:25px;transform:translateX(-50%);
                  color:#fff;font-size:27px;font-weight:900;white-space:nowrap;
                  text-shadow:0 3px 2px #000;">
        WAR GAME
      </div>

      <div class="commander">
        <div class="cap"></div>
        <div class="hair"></div>
        <div class="head"></div>
        <div class="cigar"></div>
        <div class="body"><div class="collar"></div><div class="button"></div></div>
        <div class="arm l"><div class="hand"></div></div>
        <div class="arm r"><div class="hand"></div></div>
      </div>
    </div>

    <div class="controls">
      <button class="bigbtn">
        <span class="icon">⚙️</span>HELP &amp; OPTIONS
      </button>
      <div class="spacer"></div>
      <button class="bigbtn">
        <span class="icon">📂</span>LOAD BATTLE
      </button>
      <button class="bigbtn play" id="play">
        <span class="icon">▶</span>PLAY GAME
      </button>
    </div>
  </div>
</div>

<script>
document.getElementById("play").onclick=()=>{
  alert("STEP 1 COMPLETE ✅\n\nNext step: we will build the battle screen.");
};
</script>
</body>
</html>
