<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pocket War - Battle</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08131a;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:900px;margin:auto;padding:8px}.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:24px;font-weight:900;letter-spacing:1px}.online{font-size:13px}.dot{display:inline-block;width:9px;height:9px;background:#65d35f;border-radius:50%;margin-right:5px}
.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;margin:8px 0}.card{background:#132633;border:1px solid #35566a;border-radius:10px;padding:7px 9px}.blue{border-color:#258dff}.red{border-color:#ff4b4b;text-align:right}.small{font-size:11px;opacity:.65}.score{font-size:16px;font-weight:800}.turn{background:#263747;border-radius:10px;padding:8px;text-align:center;font-weight:800}
#board{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-width:720px;margin:auto;padding:4px;background:#111c21;border:2px solid #34434a;border-radius:8px}
.cell{position:relative;aspect-ratio:1;border:1px solid rgba(255,255,255,.12);border-radius:3px;padding:0;color:white;font-size:clamp(18px,5vw,31px);display:flex;align-items:center;justify-content:center;text-shadow:1px 2px 2px #000}
.grass{background:linear-gradient(135deg,#4c793f,#385f37)}.water{background:#1c5870}.road{background:#76684d}.mountain{background:#53565a}
.base1{box-shadow:inset 0 0 0 3px #258dff}.base2{box-shadow:inset 0 0 0 3px #ff4b4b}
.sel{outline:3px solid #ffd33d;outline-offset:-3px;z-index:2}.move{background:#315d83!important}.attack{background:#753e42!important}
.hp{position:absolute;left:3px;right:3px;bottom:3px;height:4px;background:#1d2022;border-radius:5px}.hp i{display:block;height:100%;background:#5ed25c}
.label{position:absolute;top:2px;left:3px;font-size:8px;font-weight:bold}
.info{margin-top:8px;background:#122430;border:1px solid #36566a;border-radius:12px;padding:9px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.btn{border:0;border-radius:9px;padding:10px 13px;background:#176da9;color:#fff;font-weight:800}
input{background:#0e1d26;color:#fff;border:1px solid #466273;border-radius:9px;padding:10px;width:120px;text-transform:uppercase}
#game{display:none}.win{font-size:20px;font-weight:900;text-align:center;padding:12px;background:#183c29;border:1px solid #4fa46b;border-radius:10px;margin-top:8px}
@media(max-width:480px){.logo{font-size:20px}.card{padding:6px}.score{font-size:14px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><div class="logo">POCKET WAR</div><div class="small">TACTICAL BATTLE</div></div><div class="online"><span class="dot"></span><b id="status">Online</b></div></div>

  <div id="lobby" class="info">
    <div class="actions"><button class="btn" id="create">CREATE ROOM</button><button class="btn" id="join">JOIN ROOM</button>
    <input id="code" maxlength="5" placeholder="ROOM CODE"></div>
    <div class="small" id="msg" style="margin-top:7px">Create a room and send the code to Player 2.</div>
  </div>

  <div id="game">
    <div class="hud">
      <div class="card blue"><div class="small">PLAYER 1</div><div class="score">🔵 COMMAND</div></div>
      <div class="turn" id="turn">WAIT</div>
      <div class="card red"><div class="small">PLAYER 2</div><div class="score">COMMAND 🔴</div></div>
    </div>

    <div id="board"></div>

    <div class="info">
      <div><b id="roomText">ROOM</b> · <span id="help">Select your unit.</span></div>
      <div class="small">Move one square. Tap an enemy next to your unit to attack. Turns are synchronized online.</div>
    </div>
    <div id="winner"></div>
  </div>
</div>

<script>
let ws=null,myPlayer=0,state=null,selected=null;
const $=id=>document.getElementById(id);
const icons={1:"🪖",2:"🚙",3:"🪖",4:"🚙"};
const terrain=["grass","grass","road","grass","water","grass","mountain","grass"];

function connect(){
 if(ws&&(ws.readyState===0||ws.readyState===1))return;
 const proto=location.protocol==="https:"?"wss":"ws";
 ws=new WebSocket(proto+"://"+location.host);
 ws.onopen=()=>{$("status").textContent="Online"};
 ws.onclose=()=>{$("status").textContent="Offline"};
 ws.onerror=()=>{$("status").textContent="Connection error"};
 ws.onmessage=e=>{
   const m=JSON.parse(e.data);
   if(m.type==="error"){$("msg").textContent=m.message;return}
   if(m.type==="created"||m.type==="joined"){
     myPlayer=m.player;
     $("roomText").textContent="ROOM "+m.code;
     $("lobby").style.display="none";$("game").style.display="block";
   }
   if(m.type==="state"){state=m.state;render()}
 };
}
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o))}
$("create").onclick=()=>{connect();setTimeout(()=>send({type:"create"}),150)};
$("join").onclick=()=>{
 const c=$("code").value.trim().toUpperCase();
 if(c.length!==5){$("msg").textContent="Enter the 5-character room code.";return}
 connect();setTimeout(()=>send({type:"join",code:c}),150);
};

function render(){
 const b=$("board");b.innerHTML="";
 $("turn").textContent=state.winner?"PLAYER "+state.winner+" WINS":("PLAYER "+state.turn+(state.turn===myPlayer?" · YOUR TURN":" · WAIT"));
 for(let y=0;y<8;y++)for(let x=0;x<8;x++){
   const c=document.createElement("button");
   c.className="cell "+terrain[(x+y*3)%terrain.length];
   if(x===0&&y===7)c.classList.add("base1");
   if(x===7&&y===0)c.classList.add("base2");
   const u=state.units.find(a=>a.x===x&&a.y===y);
   if(selected){
     const su=state.units.find(a=>a.id===selected);
     if(su && Math.abs(su.x-x)+Math.abs(su.y-y)===1)c.classList.add(u&&u.p!==myPlayer?"attack":"move");
   }
   if(u){
     c.textContent=icons[u.id]||"🪖";
     if(u.id===selected)c.classList.add("sel");
     const hp=document.createElement("span");hp.className="hp";
     const bar=document.createElement("i");bar.style.width=Math.max(0,u.h*10)+"%";hp.appendChild(bar);c.appendChild(hp);
     const lab=document.createElement("span");lab.className="label";lab.textContent=u.p===1?"P1":"P2";c.appendChild(lab);
   }
   c.onclick=()=>tap(x,y);b.appendChild(c);
 }
}

function tap(x,y){
 if(!state||state.winner||state.turn!==myPlayer)return;
 const u=state.units.find(a=>a.x===x&&a.y===y);
 if(!selected){
   if(u&&u.p===myPlayer){selected=u.id;$("help").textContent="Choose an adjacent square to move or attack.";render()}
   return;
 }
 const su=state.units.find(a=>a.id===selected);
 if(!su){selected=null;render();return}
 if(u&&u.p===myPlayer){selected=u.id;render();return}
 if(Math.abs(su.x-x)+Math.abs(su.y-y)!==1){$("help").textContent="Choose an adjacent highlighted square.";return}
 send({type:"action",unitId:selected,x,y});
 selected=null;
}
connect();
</script>
</body>
</html>
